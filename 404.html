<!DOCTYPE html>
<html lang="ru" class="theme-light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>Страница не найдена · MEDEU</title>

  <link rel="icon" type="image/png" sizes="32x32" href="assets/favicon-32.png">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@300;400&family=Cormorant+Garamond:ital,wght@0,300;1,300;1,400&family=Jost:wght@300;400&display=swap" rel="stylesheet">

  <style>
    .theme-light {
      --c-bg: #FAF7F0;
      --c-text: #1A1612;
      --c-text-dim: #6B6660;
      --c-gold: #9A7E50;
      --c-silver: #9F9A92;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      background: var(--c-bg);
      color: var(--c-text);
      font-family: 'Jost', system-ui, sans-serif;
      font-weight: 300;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      -webkit-font-smoothing: antialiased;
    }
    .wrap {
      max-width: 640px;
      text-align: center;
    }
    .logo-img {
      height: 48px;
      width: auto;
      margin: 0 auto 64px;
      display: block;
    }
    .code {
      font-family: 'Cinzel', serif;
      font-size: clamp(4rem, 12vw, 8rem);
      font-weight: 300;
      letter-spacing: 0.1em;
      color: var(--c-gold);
      line-height: 1;
      margin: 0;
    }
    .title {
      font-family: 'Cormorant Garamond', Georgia, serif;
      font-size: clamp(1.5rem, 4vw, 2.5rem);
      font-weight: 300;
      font-style: italic;
      color: var(--c-text);
      margin: 24px 0 0;
    }
    .vignette {
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 32px auto;
      max-width: 280px;
    }
    .vignette-line {
      flex: 1;
      height: 1px;
      background: linear-gradient(to right, transparent, var(--c-gold) 50%, transparent);
      opacity: 0.5;
    }
    .vignette svg { margin: 0 12px; }
    .text {
      font-size: 15px;
      line-height: 1.8;
      color: var(--c-text-dim);
      margin: 0 0 40px;
    }
    .btn {
      display: inline-block;
      padding: 16px 40px;
      border: 1px solid var(--c-gold);
      color: var(--c-text);
      font-family: 'Jost', sans-serif;
      font-size: 12px;
      font-weight: 400;
      letter-spacing: 0.3em;
      text-transform: uppercase;
      text-decoration: none;
      position: relative;
      overflow: hidden;
      transition: color 0.5s;
    }
    .btn::before {
      content: '';
      position: absolute;
      inset: 0;
      background: var(--c-gold);
      transform: scaleX(0);
      transform-origin: left;
      transition: transform 0.5s;
      z-index: 0;
    }
    .btn:hover::before { transform: scaleX(1); }
    .btn span { position: relative; z-index: 1; transition: color 0.5s; }
    .btn:hover span { color: var(--c-bg); }
  </style>
</head>
<body>
  <div class="wrap">
    <img src="assets/logo.png" alt="MEDEU" class="logo-img">
    <p class="code">404</p>
    <h1 class="title">Страница не найдена</h1>
    <div class="vignette">
      <span class="vignette-line"></span>
      <svg width="28" height="10" viewBox="0 0 28 10" aria-hidden="true">
        <path d="M14 1 L20 5 L14 9 L8 5 Z" fill="none" stroke="#9A7E50" stroke-width="0.6"/>
        <circle cx="14" cy="5" r="0.8" fill="#9A7E50"/>
      </svg>
      <span class="vignette-line"></span>
    </div>
    <p class="text">
      Возможно, страница была перемещена или удалена.<br>
      Вернитесь на главную, чтобы продолжить знакомство с гостиничным комплексом «Медеу».
    </p>
    <a href="/medeu-site/" class="btn"><span>На главную</span></a>
  </div>
</body>
</html>
